name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Lets the deploy job publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel a deploy mid-flight
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # 1. Validate all HTML files (index.html + partials/*.html)
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .

  # 2. Check for broken internal/external links
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --no-progress
            --exclude-mail
            --exclude 'kaggle\.com'
            './**/*.html'
          fail: true

  # 3. Deploy to GitHub Pages (only on push to main, and only
  #    if both checks above passed)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [html-validate, link-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4